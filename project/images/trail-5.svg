<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto">
  <defs>
    <linearGradient id="fallSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#99f6e4" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#fallSky)" />
  <!-- Mountain Gorge -->
  <polygon points="0,400 0,100 240,160 220,400" fill="#1e293b" />
  <polygon points="380,400 360,140 600,80 600,400" fill="#334155" />
  <!-- Waterfall -->
  <polygon points="280,150 320,150 340,360 260,360" fill="#38bdf8" />
  <polygon points="290,150 310,150 325,360 275,360" fill="#ffffff" opacity="0.8" />
  <!-- Splash Basin -->
  <ellipse cx="300" cy="360" rx="90" ry="25" fill="#0284c7" />
  <!-- Forest & Bridge Trail -->
  <path d="M0 400 L0 340 Q150 320 250 340 L350 340 Q480 320 600 350 L600 400 Z" fill="#1e3a2f" />
  <!-- Wooden Footbridge -->
  <rect x="230" y="335" width="140" height="10" fill="#b45309" rx="2" />
  <line x1="230" y1="325" x2="370" y2="325" stroke="#78350f" stroke-width="3" />
  <line x1="250" y1="325" x2="250" y2="335" stroke="#78350f" stroke-width="2" />
  <line x1="290" y1="325" x2="290" y2="335" stroke="#78350f" stroke-width="2" />
  <line x1="330" y1="325" x2="330" y2="335" stroke="#78350f" stroke-width="2" />
  <line x1="360" y1="325" x2="360" y2="335" stroke="#78350f" stroke-width="2" />
  <text x="30" y="375" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="22" font-weight="bold">Cascade Falls Path</text>
</svg>
