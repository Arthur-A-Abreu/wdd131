<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album - WDD 131 - Arthur Abreu</title>
    <meta name="description" content="Temple Album page demonstrating responsive web design, CSS grid/flexbox, and JavaScript interaction for WDD 131.">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <footer>
