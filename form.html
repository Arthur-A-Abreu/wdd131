<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review - WDD 131</title>
    <meta name="description" content="Product Review Form application for WDD 131 Web Frontend Development.">
    <meta name="author" content="Arthur A. Abreu">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <section class="form-card">
            <form method="get" action="review.html" class="review-form">
                <div class="form-group">
                    <label for="product">Product Name <span class="required-indicator" aria-hidden="true">*</span></label>
                    <select id="product" name="product" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>

                <fieldset class="rating-group">
                    <legend>Overall Rating <span class="required-indicator" aria-hidden="true">*</span></legend>
                    <div class="rating-options">
                        <label class="rating-item" for="rating-1">
                            <span class="star-label" aria-hidden="true">&star;</span>
                            <input type="radio" id="rating-1" name="rating" value="1" required aria-label="1 star rating">
                        </label>
                        <label class="rating-item" for="rating-2">
                            <span class="star-label" aria-hidden="true">&star;&star;</span>
                            <input type="radio" id="rating-2" name="rating" value="2" required aria-label="2 stars rating">
                        </label>
                        <label class="rating-item" for="rating-3">
                            <span class="star-label" aria-hidden="true">&star;&star;&star;</span>
                            <input type="radio" id="rating-3" name="rating" value="3" required aria-label="3 stars rating">
                        </label>
                        <label class="rating-item" for="rating-4">
                            <span class="star-label" aria-hidden="true">&star;&star;&star;&star;</span>
                            <input type="radio" id="rating-4" name="rating" value="4" required aria-label="4 stars rating">
                        </label>
                        <label class="rating-item" for="rating-5">
                            <span class="star-label" aria-hidden="true">&star;&star;&star;&star;&star;</span>
                            <input type="radio" id="rating-5" name="rating" value="5" required aria-label="5 stars rating">
                        </label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="install-date">Date of Installation <span class="required-indicator" aria-hidden="true">*</span></label>
                    <input type="date" id="install-date" name="install-date" required>
                </div>

                <fieldset class="checkbox-group">
                    <legend>Which features did you find useful in the product? <span class="helper-text">(Check all that apply)</span></legend>
                    <div class="checkbox-options">
                        <label class="checkbox-item" for="feature-durability">
                            <input type="checkbox" id="feature-durability" name="features" value="durability">
                            <span>Durability</span>
                        </label>
                        <label class="checkbox-item" for="feature-ease">
                            <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
                            <span>Ease of Use</span>
                        </label>
                        <label class="checkbox-item" for="feature-performance">
                            <input type="checkbox" id="feature-performance" name="features" value="performance">
                            <span>Performance</span>
                        </label>
                        <label class="checkbox-item" for="feature-design">
                            <input type="checkbox" id="feature-design" name="features" value="design">
                            <span>Design</span>
                        </label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="written-review">Written Review <span class="optional-text">(Optional)</span></label>
                    <textarea id="written-review" name="written-review" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="user-name">Your Name <span class="optional-text">(Optional)</span></label>
                    <input type="text" id="user-name" name="user-name">
                </div>

                <input type="submit" value="Post Review" class="submit-btn">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> Arthur A. Abreu | Brazil</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
